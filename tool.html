<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tool</title>
    <link rel="icon" href="favicon.png" type="image/png">
    <link rel="stylesheet" href="./tool.css">
    <script src="./tool.js"></script>
</head>
<body>
    <button id="refreshPage">Refresh Page</button>
    <div id="container">
        <div id="character-inventory">
            <div id="character">
                Character: <select id="select-characters" name="select-characters"></select>
                <button id="reloadItems">Reload Items</button>
            </div>
            <div id="charItems">                
            </div>
        </div>
        <div id="items">
            <div id="location">
                Location
                <p id="locId"></p>
                <p id="locDescription"></p>
            </div>
            <div id="locItems">                
            </div>
        </div>
    </div>
    <div id="toolbox">
        <div id="create">
            <p>Create</p>
            <span id="attributes">
                ItemType:
                <select id="select-itemType"></select>                
            </span>            
        </div>
        <div id="delete">
            <p>Delete</p>
        </div>
        <button id="test-button">Test</button>
        <button id="clear-button">Clear Message</button>
        Server: <p id="server-response"></p>
    </div>
</body>
</html>
